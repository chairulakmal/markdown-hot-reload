name: markdown-hot-reload
version: '0.1.0' # keep in sync with the [package] version in Cargo.toml
summary: Read-only GitHub-flavoured markdown viewer that reloads on save
description: |
  mhr watches a markdown file and re-renders it in a native window every
  time the file changes on disk. Rendering happens entirely offline: there
  is no network access, so a document looks the same on a plane as it does
  at a desk.
base: core24
grade: devel
confinement: strict

apps:
  # Installs as `markdown-hot-reload.mhr` until a bare `mhr` alias is
  # requested from the Snap Store after publishing.
  mhr:
    command: bin/mhr
    extensions: [gnome]
    plugs:
      - home

parts:
  mhr:
    plugin: rust
    source: .
    # The system rustc on core24 is older than the edition 2024 toolchain
    # this crate needs, so the plugin bootstraps its own.
    rust-channel: stable
    build-packages:
      - libwebkit2gtk-4.1-dev
      - libgtk-3-dev
      - pkg-config
    stage-packages:
      - libwebkit2gtk-4.1-0
