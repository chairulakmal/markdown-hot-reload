<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' mhr: http://mhr.localhost; script-src 'self' mhr: http://mhr.localhost; style-src 'self' mhr: http://mhr.localhost 'unsafe-inline'; img-src 'self' mhr: data:; font-src 'self' mhr:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>mhr</title>
    <link rel="icon" type="image/svg+xml" sizes="16x16" href="icon/mhr-icon-16.svg" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="icon/mhr-icon.svg" />
    <link rel="stylesheet" href="latex.css" />
    <!--
      One highlight sheet per palette, each gated by a media attribute rather
      than a media query inside the file. chrome.js forces a palette by
      rewriting these two attributes; with no override they track the OS. See
      assets/highlight-light.css.
    -->
    <link rel="stylesheet" href="highlight-light.css" media="(prefers-color-scheme: light)" />
    <link rel="stylesheet" href="highlight-dark.css" media="(prefers-color-scheme: dark)" />
    <link rel="stylesheet" href="github.css" />
    <link rel="stylesheet" href="chrome.css" />
  </head>
  <body>
    <main id="content" class="markdown-body"><!--CONTENT--></main>

    <!--
      Everything below is application chrome and sits outside #content on
      purpose. A reload morphs the inner HTML of #content only, so markup
      placed inside it would be wiped on the next save.
    -->
    <div id="readout" hidden></div>

    <!-- Transient "125%" or "Dark" after a zoom or theme change; chrome.js fills it and hides it again. -->
    <div id="notice" hidden></div>

    <!--
      The dialog is the panel, not the full-screen backdrop that centres it, so
      the role and the focus target both sit on the panel. tabindex="-1" makes
      it focusable by script without putting it in the tab order.
    -->
    <div id="overlay" hidden>
      <div
        id="overlay-panel"
        role="dialog"
        aria-modal="true"
        aria-labelledby="overlay-title"
        tabindex="-1"
      >
        <h2 id="overlay-title">Keyboard shortcuts</h2>
        <dl id="shortcuts">
          <dt><kbd>?</kbd></dt>
          <dd>Show and hide this panel</dd>
          <dt><kbd>Esc</kbd></dt>
          <dd>Close this panel</dd>
          <dt><kbd>Ctrl</kbd> <kbd>+</kbd></dt>
          <dd>Zoom in</dd>
          <dt><kbd>Ctrl</kbd> <kbd>-</kbd></dt>
          <dd>Zoom out</dd>
          <dt><kbd>Ctrl</kbd> <kbd>0</kbd></dt>
          <dd>Reset zoom</dd>
          <dt><kbd>t</kbd></dt>
          <dd>Cycle theme: system, light, dark</dd>
        </dl>

        <!--
          The same cycle the `t` key drives, as a click target. chrome.js sets
          the button label to the active mode and advances it on click. It
          starts empty so a failed script leaves no misleading text.
        -->
        <div id="theme-control">
          <span id="theme-label">Theme</span>
          <button id="theme-toggle" type="button"></button>
        </div>

        <p id="about">
          Markdown Hot Reload v<!--VERSION-->
          <br />
          <a
            href="https://github.com/chairulakmal/markdown-hot-reload"
            target="_blank"
            rel="noopener noreferrer"
            >github.com/chairulakmal/markdown-hot-reload</a
          >
        </p>
      </div>
    </div>

    <script src="idiomorph.min.js"></script>
    <script src="app.js"></script>
    <script src="chrome.js"></script>
  </body>
</html>
