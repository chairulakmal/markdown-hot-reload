name: markdown-hot-reload
version: '0.1.0-alpha' # keep in sync with the [package] version in Cargo.toml
license: MIT
# Points at the vendored SVG rather than a copy under snap/gui/, so the Store
# listing and the app both track the one source file.
icon: assets/icon/mhr-icon.svg
summary: Read-only GitHub-flavoured markdown viewer that reloads on save
description: |
  mhr watches a markdown file and re-renders it in a native window every
  time the file changes on disk. Rendering happens entirely offline: there
  is no network access, so a document looks the same on a plane as it does
  at a desk.
base: core24
grade: devel
confinement: strict

apps:
  # Installs as `markdown-hot-reload.mhr` until a bare `mhr` alias is
  # requested from the Snap Store after publishing.
  mhr:
    command: bin/mhr
    extensions: [gnome]
    plugs:
      - home

parts:
  # Bootstraps rustup, which snapcraft 9.0.1 stopped doing. The name, the
  # symlinks and rust-channel below are all load-bearing: see AGENTS.md.
  rust-deps:
    plugin: nil
    build-packages:
      - curl
    override-pull: |
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path
      ln -sf "$HOME/.cargo/bin/cargo" /usr/local/bin/cargo
      ln -sf "$HOME/.cargo/bin/rustc" /usr/local/bin/rustc
      ln -sf "$HOME/.cargo/bin/rustup" /usr/local/bin/rustup

  mhr:
    plugin: rust
    source: .
    # `none` hands the toolchain to rust-deps; core24's system rustc is too old.
    rust-channel: none
    after:
      - rust-deps
    build-packages:
      - libwebkit2gtk-4.1-dev
      - libgtk-3-dev
      - pkg-config
    stage-packages:
      - libwebkit2gtk-4.1-0
