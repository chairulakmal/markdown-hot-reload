[package]
name = "mhr"
version = "0.1.2"
edition = "2024"
# The floor is set by dependencies (icu_* and time), not by edition 2024, which
# only needs 1.85. Declaring it also lets cargo's MSRV-aware resolver pick
# dependency versions that actually build here.
rust-version = "1.88"
description = "Read-only GitHub-flavoured markdown viewer that re-renders when the file changes on disk"
license = "MIT"
# The crate, the GitHub repo and the snap each carry a different name on
# purpose. `mhr` is what gets typed at a shell; the long name is what someone
# who has never heard of it can search for.
repository = "https://github.com/chairulakmal/markdown-hot-reload"
readme = "README.md"
keywords = ["markdown", "viewer", "preview", "gfm", "live-reload"]
categories = ["command-line-utilities", "text-processing"]
# None of these is needed to build the crate or run its tests. `CLAUDE.md` is a
# symlink to `AGENTS.md` and cargo follows it, so leaving it in ships the same
# file twice. `packaging/` stays, because `[package.metadata.deb]` below reads
# `packaging/mhr.desktop`, and dropping it would break `cargo deb` for anyone
# building from the published crate.
exclude = ["docs/", "snap/", ".github/", ".claude/", "CLAUDE.md", "deny.toml"]

# `$auto` runs dpkg-shlibdeps against the linked binary, so the WebKitGTK and
# GTK versions in Depends come from the build machine instead of a hand-written
# list that silently goes stale. maintainer is required: there is no authors key.
[package.metadata.deb]
maintainer = "Chairul Akmal <chairulakmal@protonmail.com>"
depends = "$auto"
section = "utils"
priority = "optional"
# Without these, cargo-deb never reads LICENSE (it only auto-detects via the
# top-level `license-file` key, which this crate doesn't set) and the shipped
# copyright file says "Copyright information missing" instead of naming
# anyone. `4` skips past the "MIT License" heading and blank line so the
# embedded text starts at the copyright line itself.
copyright = "2026 Chairul Akmal"
license-file = ["LICENSE", "4"]
extended-description = """\
mhr opens a native window showing a rendered markdown file and re-renders it \
every time the file changes on disk. It never writes to the file it watches, \
and it has no network access, so a document renders identically offline."""
assets = [
    ["target/release/mhr", "usr/bin/", "755"],
    ["packaging/mhr.desktop", "usr/share/applications/", "644"],
    # Resolves Icon=mhr in the desktop entry. Scalable rather than a rasterised
    # hicolor size, so the one SVG serves every resolution.
    ["assets/icon/mhr-icon.svg", "usr/share/icons/hicolor/scalable/apps/mhr.svg", "644"],
    ["README.md", "usr/share/doc/mhr/README.md", "644"],
]

[dependencies]
anyhow = "1.0.104"
comrak = { version = "0.54.0", default-features = false, features = ["syntect-fancy"] }
notify = "8.2.0"
notify-debouncer-full = "0.7.0"
pulldown-latex = "0.8"
rust-embed = { version = "8.12.0", features = ["compression"] }
serde_json = "1.0.151"
tao = "0.36.0"
wry = "0.56.1"

# Lint levels live here rather than in a CI invocation, so `cargo clippy` gives
# every contributor the same bar the pipeline enforces. The code already passes
# pedantic with zero warnings, and contains no `unsafe`, so both are free today
# and only cost something the moment that stops being true.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
