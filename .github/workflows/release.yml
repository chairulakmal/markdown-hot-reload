name: Release

# Tags only. Artifacts are cut from a tag so the version in the filename is
# never in doubt; pushes to main go through CI and produce nothing downloadable.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  # Pinned rather than `stable`, unlike the ci job: a released binary should
  # come from a compiler that was chosen. Matches the dev machine. Bump it
  # deliberately, and never below rust-version in Cargo.toml.
  RUST_VERSION: 1.97.1
  # Pinned so packaging behavior changes only when this file changes,
  # not whenever crates.io publishes a new cargo-deb release.
  CARGO_DEB_VERSION: 3.7.0

jobs:
  release:
    # Same runner as ci, so the glibc floor of the artifacts is 24.04's 2.39.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Only this job writes, and only to draft the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Same list as build-packages in snap/snapcraft.yaml and the ci job.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2

      # Four places carry the version. A mismatch in the first three ships
      # mislabeled files; one in the install page hands visitors a download
      # command for a release they did not ask for.
      - name: Check the tag against Cargo.toml, snapcraft.yaml and the install page
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          snap=$(sed -n "s/^version: '\(.*\)'.*/\1/p" snap/snapcraft.yaml | head -1)
          if [ "$tag" != "$crate" ] || [ "$tag" != "$snap" ]; then
            echo "tag $tag, Cargo.toml $crate, snapcraft.yaml $snap"
            exit 1
          fi
          # docs/index.html names the current release about ten times, and a
          # partial bump is the failure this catches, so the rule is that
          # every version string on the page equals the tag, rather than a
          # count of them that any new sentence would break. A prerelease
          # suffix marks a historical tag quoted on purpose (v0.1.0-alpha)
          # and is skipped; the deb's -1 revision is not one of those and
          # stays in scope. Not in ci, where the page correctly names the
          # previous release until the day this runs.
          case "$GITHUB_REF_NAME" in
            *-*)
              echo "prerelease tag: the install page names the current stable release, so it is left alone"
              ;;
            *)
              fix="bump the page on main, then move the tag to that commit"
              # Also catches the page losing the version entirely, which the
              # scan below would read as "nothing stale" and wave through.
              if ! grep -qF "$tag" docs/index.html; then
                echo "docs/index.html does not name $tag anywhere: $fix"
                exit 1
              fi
              stale=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z][0-9A-Za-z.]*)?' docs/index.html \
                | grep -v -- '-' \
                | grep -vFx "$tag" \
                | sort -u || true)
              if [ -n "$stale" ]; then
                echo "docs/index.html still names $(echo "$stale" | tr '\n' ' ')but the tag is $tag: $fix"
                exit 1
              fi
              ;;
          esac

      - name: cargo build
        run: cargo build --locked --release

      # Compiled from source on every release. Releases are rare enough that a
      # few minutes here is cheaper than trusting a prebuilt binary.
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked --version "$CARGO_DEB_VERSION"

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          dir="mhr-${version}-x86_64-unknown-linux-gnu"
          mkdir -p dist "$dir"
          # rust-cache restores target/ keyed on Cargo.lock, and cargo-deb
          # names .deb files by version, so a cache hit can leave a stale
          # .deb from an earlier tag alongside the one built below.
          rm -rf target/debian
          cargo deb --no-build
          cp target/debian/*.deb dist/
          cp target/release/mhr README.md LICENSE "$dir/"
          tar czf "dist/${dir}.tar.gz" "$dir"
          sha256sum dist/*.deb dist/*.tar.gz | sed 's|dist/||' > dist/SHA256SUMS

      # Draft, so the notes get read before anyone can download the files.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A hyphen marks a semver prerelease (-alpha, -beta, -rc.1), so a
          # tag like v0.1.0-alpha is drafted as a GitHub pre-release instead
          # of landing as the repo's "Latest" release once published.
          prerelease=()
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}" \
            dist/*
